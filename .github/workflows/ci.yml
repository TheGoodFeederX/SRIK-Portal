name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck && pnpm --filter @srik/web api:typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @srik/web build
      # Spec v1.1 §90: critical/high must fail CI. Exceptions are listed in
      # docs/security/AUDIT_EXCEPTIONS.md; there is no blanket `|| true`.
      - name: Dependency audit (critical fails, production deps)
        run: pnpm audit --audit-level=critical --prod
      - name: Dependency audit (high must be allowlisted)
        run: |
          pnpm audit --audit-level=high --prod --json > audit.json || true
          node scripts/audit-gate.mjs
      - name: No server secrets in the client bundle
        run: |
          if grep -rIlE "npg_|napi_|secret_server_key|NEON_AUTH_BASE_URL" apps/web/dist; then
            echo "::error::Server secret or server-only env leaked into the client bundle"
            exit 1
          fi
          echo "client bundle clean"
